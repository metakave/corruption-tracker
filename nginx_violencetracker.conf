server {
    server_name violencetracker.org www.violencetracker.org;

    # Move Prisma Studio to /admin-prisma/
    location /admin-prisma/ {
        auth_basic "Database Admin Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://localhost:5555/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prisma Studio API Internals
    location = /api {
        proxy_pass http://localhost:5555/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /http/ {
        proxy_pass http://localhost:5555/http/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # Prisma Studio Assets
    location /assets/ {
        proxy_pass http://localhost:5555/assets/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # Serve Photocards directly from filesystem because Next.js doesn't see new runtime files in public/
    location /photocards/ {
        alias /var/www/political_violence_tracker/public/photocards/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Main App (Handled by Next.js, including /admin-db/)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/violencetracker.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/violencetracker.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = violencetracker.org) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name violencetracker.org www.violencetracker.org;
    return 404;
}
