services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tracker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tracker_internal

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - tracker_internal

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - tracker_internal

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "4005:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@postgres:5432/tracker_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      WEB_URL: https://tracker.musfiqurtuhin.me
    depends_on:
      - postgres
      - redis
    networks:
      - tracker_internal
      - tracker_external

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://tracker.musfiqurtuhin.me/api/v1
    restart: always
    ports:
      - "3007:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://tracker.musfiqurtuhin.me/api/v1
    depends_on:
      - api
    networks:
      - tracker_external

networks:
  tracker_internal:
  tracker_external:

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
